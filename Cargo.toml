[package]
name = "git-compose-commit"
version = "0.1.0"
edition = "2021"
description = "Build well-formatted Git commit messages from the command line"
license = "MIT"
repository = "https://github.com/demerphq/git-compose-commit"
homepage = "https://github.com/demerphq/git-compose-commit"
readme = "README.md"
keywords = ["git", "commit", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "skills/**", "scripts/**", "tests/end_to_end.rs", "tests/test_distribution.py", "tests/fixtures/**", "README.md", "LICENSE", "docs/**", "Cargo.toml", "Cargo.lock"]

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{bin}{binary-ext}"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.zip"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-aarch64-unknown-linux-musl.tar.gz"

[dependencies]
hascii = "0.1.3"
unicode-segmentation = "1"
unicode-width = "0.1"

[[bin]]
name = "git-compose-commit"
path = "src/main.rs"

[[bin]]
name = "cli-compose-text"
path = "src/cli_compose_text.rs"
